# Lints every commit in a pull request against Conventional Commits.
#
# The release script (src/scripts/release.mjs) computes the next version and
# the changelog from commit headers, so a header it cannot parse is a change
# that silently never reaches either. This check stops such commits before
# they merge. It only reads; nothing here tags, releases or writes.
name: Commits

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 is load-bearing: the default depth of 1 fetches neither
      # the PR's base commit nor its own commits, so the range below would not
      # resolve and every run would fail for the wrong reason.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # base.sha..head.sha is exactly the PR's own commits; merge commits are
      # skipped by the script. SHAs go through env, never interpolated into
      # the shell line.
      - name: Lint commit headers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node src/scripts/lint-commits.mjs "${BASE_SHA}..${HEAD_SHA}"
