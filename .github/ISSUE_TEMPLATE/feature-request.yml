name: Feature request
description: Suggest something the skill should do, or do differently
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: What's the feature?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is this related to a problem? If so, what?
    validations:
      required: false

  - type: textarea
    id: example
    attributes:
      label: Example prompt
      description: A message you would send that the skill should handle this way.
      render: text
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
    validations:
      required: false
